name: LumaSpace
options:
  bundleIdPrefix: com.lumaspace
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

targets:
  LumaSpace:
    type: application
    platform: iOS
    bundleId: com.lumaspace.app
    sources:
      - path: LumaSpace
        excludes:
          - "**/.DS_Store"
          - "**/StoreKit"
    resources:
      - path: LumaSpace/Resources/Assets.xcassets
      - path: LumaSpace/Resources/LumaSpace.storekit
    info:
      path: LumaSpace/App/Info.plist
      properties:
        CFBundleDisplayName: LumaSpace
        NSCameraUsageDescription: "LumaSpace uses your camera to scan rooms and place furniture in augmented reality."
        NSPhotoLibraryUsageDescription: "LumaSpace can save and import images for your moodboard."
        NSPhotoLibraryAddUsageDescription: "LumaSpace saves your design exports to Photos."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LumaAccent
        BGTaskSchedulerPermittedIdentifiers:
          - com.lumaspace.app.refresh
        UIBackgroundModes:
          - fetch
          - remote-notification
    entitlements:
      path: LumaSpace/App/LumaSpace.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lumaspace.app
        com.apple.developer.in-app-payments:
          - com.lumaspace.pro.monthly
          - com.lumaspace.pro.annual
          - com.lumaspace.premium.monthly
          - com.lumaspace.premium.annual
          - com.lumaspace.lifetime
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lumaspace.app
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.lumaspace.app
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumaspace.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LumaSpace/App/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: RoomPlan.framework
      - sdk: StoreKit.framework
      - sdk: PDFKit.framework
      - sdk: PhotosUI.framework
      - sdk: CloudKit.framework
      - sdk: TipKit.framework
      - target: LumaSpaceWidget

  LumaSpaceWidget:
    type: app-extension
    platform: iOS
    bundleId: com.lumaspace.app.widget
    sources:
      - path: LumaSpaceWidget
    info:
      path: LumaSpaceWidget/Info.plist
      properties:
        CFBundleDisplayName: LumaSpace Widget
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LumaSpaceWidget/LumaSpaceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lumaspace.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumaspace.app.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LumaSpaceWidget/Info.plist
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  LumaSpace:
    build:
      targets:
        LumaSpace: all
    run:
      config: Debug
      storeKitConfiguration: LumaSpace/Resources/LumaSpace.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
